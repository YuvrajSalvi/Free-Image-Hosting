name: Upload images to ImgBB

on:
  push:
    branches: [main]
    paths:
      - 'images/**'          # manifest lives outside this folder, so its commit can't retrigger this
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-upload every image, even unchanged ones'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: imgbb-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload new or changed images
        id: upload
        continue-on-error: true   # still commit partial progress below
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          FORCE_REUPLOAD: ${{ inputs.force }}
        run: node scripts/upload-images.mjs

      - name: Commit manifest if changed
        run: |
          if [ -z "$(git status --porcelain -- images.manifest.json)" ]; then
            echo "Manifest unchanged."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.manifest.json
          git commit -m "chore: update image manifest [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      - name: Fail run if any upload failed
        if: steps.upload.outcome == 'failure'
        run: |
          echo "One or more uploads failed. Re-run the workflow to retry; finished uploads are skipped."
          exit 1
